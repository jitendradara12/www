{{ define "title" -}}
<h1 class="display-lg p-name">{{ .Title }}</h1>
{{- if and (not .Date.IsZero) (ne .RelPermalink "/me/contact/") }}
<div class="post-meta label-sm">
  <time datetime="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Lastmod.Format "02 Jan 2006" }}</time>
  <span class="meta-sep">·</span>
  <span>{{ .ReadingTime }} min read</span>
</div>
{{- end }}
{{- end }}
