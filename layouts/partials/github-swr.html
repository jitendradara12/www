{{/* layouts/partials/github-swr.html: Lightweight progressive background check for latest GitHub commit */}}
<script>
(function() {
  var USER = 'jitendradara12';
  var KEY = 'gh_commit_swr_v3';
  var TTL = 15 * 60 * 1000;

  function timeAgo(date) {
    var s = Math.floor((Date.now() - date.getTime()) / 1000);
    if (s < 60) return 'just now';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    var h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    var d = Math.floor(h / 24);
    if (d === 1) return 'yesterday';
    if (d < 30) return d + 'd ago';
    var months = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
    return String(date.getDate()).padStart(2, '0') + ' ' + months[date.getMonth()] + ' ' + date.getFullYear();
  }

  function formatMessage(rawMsg, branch) {
    var line = rawMsg ? String(rawMsg).split('\n')[0].trim() : '';
    if (!line) return 'push to ' + (branch || 'main');
    return line.length > 72 ? line.slice(0, 69) + '…' : line;
  }

  function updateDOM(d) {
    if (!d || !d.sha) return;
    var ago = d.date ? timeAgo(new Date(d.date)) : '';

    // Commit card (shared by homepage and /now)
    var nowCard = document.getElementById('now-commit');
    if (nowCard) {
      var shaEl = nowCard.querySelector('.now-commit-sha');
      var msgEl = nowCard.querySelector('.now-commit-msg');
      var repoEl = nowCard.querySelector('.now-commit-repo');
      var branchEl = nowCard.querySelector('.now-commit-branch');
      var timeEl = nowCard.querySelector('time');

      if (shaEl && d.short_sha) {
        shaEl.href = d.commit_url || ('https://github.com/' + d.repo + '/commit/' + d.sha);
        var code = shaEl.querySelector('code');
        if (code) code.textContent = d.short_sha;
        else shaEl.textContent = d.short_sha;
      }
      if (msgEl && d.message) {
        msgEl.textContent = formatMessage(d.message, d.branch);
        if (d.commit_url && msgEl.tagName === 'A') {
          msgEl.href = d.commit_url;
        }
      }
      if (repoEl && d.repo_name) {
        repoEl.href = d.repo_url || ('https://github.com/' + d.repo);
        repoEl.textContent = d.repo_name;
      }
      if (d.branch) {
        if (!branchEl) {
          var metaEl = nowCard.querySelector('.now-commit-meta');
          if (metaEl) {
            branchEl = document.createElement('span');
            branchEl.className = 'now-commit-branch';
            metaEl.appendChild(branchEl);
          }
        }
        if (branchEl) {
          branchEl.textContent = d.branch;
          branchEl.hidden = false;
        }
      } else if (branchEl) {
        branchEl.textContent = '';
        branchEl.hidden = true;
      }
      if (timeEl && d.date) {
        timeEl.setAttribute('datetime', d.date);
        timeEl.textContent = ago;
      }
    }
  }

  var nowCard = document.getElementById('now-commit');
  var ssrTimeEl = nowCard ? nowCard.querySelector('time[datetime]') : null;
  var ssrShaEl = nowCard ? nowCard.querySelector('.now-commit-sha') : null;
  var ssrSha = ssrShaEl ? ssrShaEl.textContent.trim() : '';
  var ssrDateMs = 0;
  if (ssrTimeEl) {
    var ssrDt = new Date(ssrTimeEl.getAttribute('datetime'));
    if (!isNaN(ssrDt.getTime())) {
      ssrDateMs = ssrDt.getTime();
      ssrTimeEl.textContent = timeAgo(ssrDt);
    }
  }

  function isFresherThanSSR(d) {
    if (!d || !d.sha) return false;
    var ms = d.date ? Date.parse(d.date) : 0;
    if (ssrDateMs && (!ms || ms < ssrDateMs)) return false;
    if (d._fallback && ssrSha && d.short_sha === ssrSha) return false;
    return true;
  }

  function saveCache(data) {
    try { localStorage.setItem(KEY, JSON.stringify({ time: Date.now(), data: data })); } catch(e) {}
  }

  var cached = null;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) cached = JSON.parse(raw);
  } catch(e) {}

  if (cached && cached.data && isFresherThanSSR(cached.data)) {
    updateDOM(cached.data);
  }

  if (!cached || (Date.now() - cached.time > TTL)) {
    var fallbackCache = (cached && cached.data && isFresherThanSSR(cached.data)) ? cached.data : null;
    fetch('https://api.github.com/users/' + USER + '/events?per_page=30', { priority: 'low' })
      .then(function(r) {
        if (!r.ok) { saveCache(fallbackCache); return null; }
        return r.json();
      })
      .then(function(events) {
        if (!Array.isArray(events)) { saveCache(fallbackCache); return; }
        var pushes = [];
        for (var i = 0; i < events.length; i++) {
          if (events[i].type === 'PushEvent' && events[i].payload) {
            pushes.push(events[i]);
          }
        }
        if (!pushes.length) { saveCache(fallbackCache); return; }

        pushes.sort(function(a, b) {
          return new Date(b.created_at) - new Date(a.created_at);
        });
        var push = pushes[0];

        var repoFull = push.repo.name;
        var repoName = repoFull.split('/')[1] || repoFull;
        var p = push.payload;
        var headSha = p.head || (p.commits && p.commits.length ? p.commits[p.commits.length - 1].sha : null);
        if (!headSha) { saveCache(fallbackCache); return; }

        var commitMsg = (p.commits && p.commits.length) ? p.commits[p.commits.length - 1].message : null;
        var rawRef = p.ref || '';
        var branch = rawRef.indexOf('refs/tags/') === 0 ? '' : rawRef.replace(/^refs\/heads\//, '');
        var date = push.created_at;

        var commitData = {
          sha: headSha,
          short_sha: headSha.substring(0, 7),
          repo: repoFull,
          repo_name: repoName,
          branch: branch,
          message: formatMessage(commitMsg, branch),
          date: date,
          commit_url: 'https://github.com/' + repoFull + '/commit/' + headSha,
          repo_url: 'https://github.com/' + repoFull,
          _fallback: !commitMsg
        };

        if (!commitMsg) {
          fetch('https://api.github.com/repos/' + repoFull + '/commits/' + headSha, { priority: 'low' })
            .then(function(r) { return r.ok ? r.json() : null; })
            .then(function(d) {
              if (d && d.commit && d.commit.message) {
                commitData.message = formatMessage(d.commit.message, branch);
                commitData._fallback = false;
                if (d.commit.author && d.commit.author.date) commitData.date = d.commit.author.date;
              }
              saveAndApply(commitData);
            })
            .catch(function() { saveAndApply(commitData); });
        } else {
          saveAndApply(commitData);
        }
      })
      .catch(function() { saveCache(fallbackCache); });
  }

  function saveAndApply(data) {
    if (isFresherThanSSR(data)) {
      delete data._fallback;
      saveCache(data);
      updateDOM(data);
    } else {
      saveCache(cached && cached.data && isFresherThanSSR(cached.data) ? cached.data : null);
    }
  }
})();
</script>
