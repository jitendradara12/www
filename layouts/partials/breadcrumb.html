<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol>
    {{ range .Ancestors.Reverse }}
    <li>
      <a href="{{- .RelPermalink }}">{{- .LinkTitle }}</a>
    </li>
    {{ end }}
    <!-- the current page -->
    <li class="active" aria-current="page">
      <a href="{{- .RelPermalink }}">{{- .LinkTitle }}</a>
    </li>
  </ol>
</nav>
