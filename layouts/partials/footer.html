<footer class="editorial-footer">
  <div class="footer-inner">
    <div class="footer-left">
      © 2026 // made with hugo in neovim (btw)
    </div>

    <div class="footer-right">

      <a href="https://xn--sr8hvo.ws/previous" aria-label="Previous IndieWeb site">←</a>
      <a href="https://xn--sr8hvo.ws" aria-label="IndieWeb Webring">🕸</a>
      <a href="https://xn--sr8hvo.ws/next" aria-label="Next IndieWeb site">→</a>

      {{ with .Site.Params.github }}
      <a href="{{ . }}" target="_blank" rel="me noopener" title="GitHub">
        <img src="/logos/github.svg" alt="GitHub" width="11" height="11" />
      </a>
      {{ end }}
      {{ with .Site.Params.linkedin }}
      <a href="{{ . }}" target="_blank" rel="me noopener" title="LinkedIn">
        <img src="/logos/linkedin.svg" alt="LinkedIn" width="11" height="11" />
      </a>
      {{ end }}
      {{ with .Site.Params.email }}
      <a href="mailto:{{ . }}" rel="me" title="Email">
        <img src="/logos/gmail.svg" alt="Email" width="11" height="11" />
      </a>
      {{ end }}

      <a href="/photography/" rel="me" title="clicks">
        <img src="/logos/camera.svg" alt="camera" width="11" height="11" />
      </a>
      <a href="/index.xml" title="RSS Feed if you're a real chad">
        <img src="/logos/rss.svg" alt="RSS Feed" width="11" height="11" />
      </a>
    </div>
  </div>
</footer>
