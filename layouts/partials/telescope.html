{{/* layouts/partials/telescope.html: Telescope.nvim / fzf --preview="bat" fuzzy finder + Vim normal-mode motions */}}
<div id="telescope-backdrop" class="ts-backdrop" hidden aria-hidden="true">
  <div class="ts-modal" role="dialog" aria-modal="true" aria-label="Telescope">
    <div class="ts-body">
      <!-- Left pane: Prompt + Results -->
      <div class="ts-left">
        <div class="ts-pane-title"><span>Telescope</span><span class="ts-pane-title-right"><span class="ts-counter" id="ts-counter">0/0</span><button type="button" class="ts-close" id="ts-close" aria-label="Close Telescope">esc</button></span></div>
        <div class="ts-prompt-row">
          <span class="ts-prompt-char" id="ts-prompt-char">❯</span>
          <input
            type="text"
            id="ts-input"
            class="ts-input"
            role="combobox"
            aria-label="Search pages and commands"
            aria-autocomplete="list"
            aria-controls="ts-results"
            aria-expanded="false"
            placeholder=""
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
          />
        </div>
        <ul class="ts-results" id="ts-results" role="listbox" aria-label="Results"></ul>
      </div>

      <!-- Right pane: preview -->
      <div class="ts-right">
        <div class="ts-pane-title"><span id="ts-preview-title">~/</span></div>
        <div class="ts-preview" id="ts-preview"></div>
      </div>
    </div>

    <!-- Status bar -->
    <div class="ts-statusline">
      <div class="ts-status-left">
        <span class="ts-mode" id="ts-mode">INSERT</span>
        <span class="ts-status-msg" id="ts-status-msg" role="status" aria-live="polite"></span>
      </div>
      <div class="ts-status-right">
        <span><kbd>↑↓</kbd> / <kbd>^n</kbd><kbd>^p</kbd> move</span>
        <span><kbd>↵</kbd> open</span>
        <span><kbd>esc</kbd> close</span>
      </div>
    </div>
  </div>
</div>

<!-- Subtle Vim keychord / status toast (bottom-right) -->
<div id="vim-chord" class="vim-chord" role="status" aria-live="polite" hidden></div>

<script>
(function() {
  var backdrop = document.getElementById('telescope-backdrop');
  var input = document.getElementById('ts-input');
  var resultsEl = document.getElementById('ts-results');
  var previewEl = document.getElementById('ts-preview');
  var previewTitleEl = document.getElementById('ts-preview-title');
  var counterEl = document.getElementById('ts-counter');
  var modeEl = document.getElementById('ts-mode');
  var statusMsgEl = document.getElementById('ts-status-msg');
  var promptCharEl = document.getElementById('ts-prompt-char');
  var triggerBtn = document.getElementById('cmd-trigger');
  var closeBtn = document.getElementById('ts-close');
  var chordEl = document.getElementById('vim-chord');

  var modalEl = backdrop.querySelector('.ts-modal');
  var indexData = null;
  var indexPromise = null;
  var filtered = [];
  var selectedIdx = 0;
  var isOpen = false;
  var previousFocus = null;
  {{- $wtTotal := "46 hrs 9 mins" -}}
  {{- with hugo.Data.wakatime.rollup_7d.total }}{{ $wtTotal = . }}{{ end -}}
  {{- $wtAvg := "2 hrs 59 mins" -}}
  {{- with hugo.Data.wakatime.rollup_7d.daily_average }}{{ $wtAvg = . }}{{ end -}}
  {{- $ghCommit := "clean" -}}
  {{- $ghDate := "" -}}
  {{- with hugo.Data.github -}}
    {{- $ghCommit = printf "%s@%s" .repo_name .short_sha -}}
    {{- with .date }}{{ $ghDate = . }}{{ end -}}
  {{- end }}
  var ssrGhDate = {{ $ghDate | jsonify | safeJS }};

  var builtinCommands = [
    {
      title: ':fastfetch',
      path: ':fastfetch',
      url: '#fastfetch',
      section: 'cmd',
      date: 'exec',
      meta: 'system telemetry',
      isCmd: 'fastfetch',
      preview: [
        '  ▗▄   ▗▄ ▄▖    jitendra@0x43',
        ' ▄▄▄█▄▄▄▄█▛ ▃   -------------',
        '   ▟▛    ▜▃▟▛   os: nixos',
        '▀▀▜█      █▛▀▀  kern: linux 7.xx',
        ' ▗▛▀▙    ▟▛     wm: hyprland',
        ' ▀ ▟█▀▀▀▀█▀▀▀   sh: zsh',
        '  ▝▀ ▀▘   ▀▘    term: kitty',
        '                ed: neovim',
        '',
        '7d code : ' + {{ $wtTotal | jsonify | safeJS }},
        'avg/day : ' + {{ $wtAvg | jsonify | safeJS }},
        'commit  : ' + {{ $ghCommit | jsonify | safeJS }}
      ].join('\n')
    },
    {
      title: ':theme',
      path: ':theme',
      url: '#theme',
      section: 'cmd',
      date: 'exec',
      meta: 'toggle dark / light mode',
      isCmd: 'theme',
      preview: 'toggle flashbang.'
    },
    {
      title: ':keymaps',
      path: ':keymaps',
      url: '#keymaps',
      section: 'cmd',
      date: 'help',
      meta: 'normal mode bindings',
      isCmd: 'noop',
      preview: [
        '/ or : or ^k   open telescope',
        'j / k          scroll down / up',
        'gg / G         top / bottom',
        'gh             ~/home',
        'gp             ~/me',
        'gw             ~/writings',
        'gn             ~/now',
        'gc             ~/me/contact',
        'gf             ~/photography'
      ].join('\n')
    },
    {
      title: ':q!',
      path: ':q!',
      url: '#quit',
      section: 'cmd',
      date: 'exit',
      meta: 'quit',
      isCmd: 'quit',
      preview: 'close telescope.'
    }
  ];

  function showToast(msg, duration) {
    if (!chordEl) return;
    chordEl.textContent = msg;
    chordEl.hidden = false;
    clearTimeout(chordEl._timer);
    if (duration !== 0) {
      chordEl._timer = setTimeout(function() {
        chordEl.hidden = true;
      }, duration || 2200);
    }
  }

  function setBackgroundInert(state) {
    document.querySelectorAll('body > nav, body > main, body > footer').forEach(function(el) {
      el.inert = state;
    });
  }

  function loadIndex() {
    if (indexData) return Promise.resolve(indexData);
    if (!indexPromise) {
      indexPromise = fetch('/index.json')
        .then(function(r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(function(data) {
          indexData = data.concat(builtinCommands);
          return indexData;
        })
        .catch(function() {
          indexPromise = null;
          return builtinCommands;
        });
    }
    return indexPromise;
  }

  // Fuzzy match scorer + character highlighter
  function fuzzyScore(query, text) {
    if (!query) return { score: 1, indices: [] };
    var q = query.toLowerCase();
    var t = text.toLowerCase();
    var qi = 0;
    var score = 0;
    var consecutive = 0;
    var indices = [];

    for (var ti = 0; ti < t.length && qi < q.length; ti++) {
      if (t[ti] === q[qi]) {
        indices.push(ti);
        consecutive++;
        score += 10 + consecutive * 5;
        if (ti === 0 || t[ti - 1] === '/' || t[ti - 1] === '-' || t[ti - 1] === ' ') {
          score += 15; // word boundary bonus
        }
        qi++;
      } else {
        consecutive = 0;
        score -= 1;
      }
    }
    if (qi < q.length) return null;
    return { score: score, indices: indices };
  }

  function highlightText(text, indices) {
    if (!indices || !indices.length) return escapeHtml(text);
    var set = {};
    for (var i = 0; i < indices.length; i++) set[indices[i]] = true;
    var out = '';
    for (var j = 0; j < text.length; j++) {
      var ch = escapeHtml(text[j]);
      out += set[j] ? '<mark class="ts-match">' + ch + '</mark>' : ch;
    }
    return out;
  }

  function escapeHtml(s) {
    return String(s || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function getPreviewText(item) {
    var raw = String(item.preview || item.summary || '');
    if (item.isCmd !== 'fastfetch') return raw;
    try {
      var rawCache = localStorage.getItem('gh_commit_swr_v3');
      if (rawCache) {
        var c = JSON.parse(rawCache);
        var d = c && c.data;
        if (d && d.repo_name && d.short_sha) {
          var ssrMs = ssrGhDate ? Date.parse(ssrGhDate) : 0;
          var cMs = d.date ? Date.parse(d.date) : 0;
          if (!ssrMs || (cMs && cMs >= ssrMs)) {
            return raw.replace(/^commit  : .*$/m, 'commit  : ' + d.repo_name + '@' + d.short_sha);
          }
        }
      }
    } catch (e) {}
    return raw;
  }

  function renderPreview(item) {
    if (!item) {
      previewTitleEl.textContent = 'Preview';
      previewEl.innerHTML = '<div class="ts-empty">No matching buffer</div>';
      return;
    }
    previewTitleEl.textContent = item.path || item.url;
    var lines = [];
    if (item.section !== 'cmd') {
      lines.push('<span class="bat-delim">+++</span>');
      lines.push('<span class="bat-key">title</span>   = <span class="bat-str">"' + escapeHtml(item.title) + '"</span>');
      lines.push('<span class="bat-key">section</span> = <span class="bat-str">"' + escapeHtml(item.section) + '"</span>');
      if (item.meta) {
        lines.push('<span class="bat-comment"># ' + escapeHtml(item.meta) + '</span>');
      }
      if (item.github) {
        lines.push('<span class="bat-key">github</span>  = <span class="bat-str">"' + escapeHtml(item.github) + '"</span>');
      }
      if (item.live) {
        lines.push('<span class="bat-key">live</span>    = <span class="bat-str">"' + escapeHtml(item.live) + '"</span>');
      }
      lines.push('<span class="bat-delim">+++</span>');
      lines.push('');
    }

    var bodyLines = getPreviewText(item).split('\n');
    for (var i = 0; i < bodyLines.length; i++) {
      lines.push(escapeHtml(bodyLines[i]));
    }

    var isCmdClass = item.section === 'cmd' ? ' is-cmd' : '';
    var html = '<div class="bat-code' + isCmdClass + '">';
    for (var l = 0; l < lines.length; l++) {
      html += '<div class="bat-line"><span class="bat-ln">' + (l + 1) + '</span><span class="bat-txt">' + (lines[l] || ' ') + '</span></div>';
    }
    html += '</div>';
    if (item.cover) {
      html += '<div class="ts-preview-img-wrap"><img src="' + escapeHtml(item.cover) + '" alt="' + escapeHtml(item.title) + '" class="ts-preview-img" loading="lazy" /></div>';
    }
    previewEl.innerHTML = html;
  }

  function renderResults() {
    var rawQ = input.value.trim();
    var isCommandMode = rawQ.indexOf(':') === 0;
    promptCharEl.textContent = isCommandMode ? ':' : '❯';
    modeEl.textContent = isCommandMode ? 'COMMAND' : 'INSERT';

    var q = isCommandMode ? rawQ.slice(1).trim() : rawQ;
    var list = indexData || builtinCommands;

    if (!rawQ) {
      filtered = list.map(function(item) {
        return { item: item, titleIndices: [], pathIndices: [] };
      });
    } else {
      var scored = [];
      for (var i = 0; i < list.length; i++) {
        var it = list[i];
        var mTitle = fuzzyScore(q, it.title);
        var mPath = fuzzyScore(q, it.path || '');
        var mMeta = fuzzyScore(q, (it.meta || '') + ' ' + (it.preview || ''));

        var best = null;
        var tIdx = [];
        var pIdx = [];

        if (mTitle) {
          best = mTitle.score + 25;
          tIdx = mTitle.indices;
        }
        if (mPath && (best === null || mPath.score + 15 > best)) {
          best = mPath.score + 15;
          pIdx = mPath.indices;
        }
        if (mMeta && best === null) {
          best = mMeta.score;
        }
        if (best !== null) {
          if (isCommandMode && it.section === 'cmd') best += 50;
          scored.push({ item: it, score: best, titleIndices: tIdx, pathIndices: pIdx });
        }
      }
      scored.sort(function(a, b) { return b.score - a.score; });
      filtered = scored;
    }

    if (selectedIdx >= filtered.length) selectedIdx = 0;
    if (selectedIdx < 0) selectedIdx = Math.max(0, filtered.length - 1);

    counterEl.textContent = (filtered.length ? (selectedIdx + 1) : 0) + '/' + filtered.length;

    var html = '';
    for (var r = 0; r < filtered.length; r++) {
      var entry = filtered[r];
      var it = entry.item;
      var activeClass = r === selectedIdx ? ' is-selected' : '';
      var badge = it.section || 'page';
      html += '<li id="ts-opt-' + r + '" class="ts-item' + activeClass + '" data-idx="' + r + '" role="option" aria-selected="' + (r === selectedIdx) + '">' +
        '<span class="ts-item-badge ts-badge-' + escapeHtml(badge) + '">' + escapeHtml(badge) + '</span>' +
        '<span class="ts-item-title">' + highlightText(it.title, entry.titleIndices) + '</span>' +
        '<span class="ts-item-path">' + highlightText(it.path || '', entry.pathIndices) + '</span>' +
      '</li>';
    }
    resultsEl.innerHTML = html || '<li class="ts-empty-item" role="option" aria-disabled="true">No matches found</li>';

    if (filtered.length) {
      input.setAttribute('aria-activedescendant', 'ts-opt-' + selectedIdx);
    } else {
      input.removeAttribute('aria-activedescendant');
    }

    var activeEl = resultsEl.querySelector('.is-selected');
    if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });

    renderPreview(filtered[selectedIdx] ? filtered[selectedIdx].item : null);
  }

  function checkSpecialQuit(raw) {
    if (raw === ':q') {
      statusMsgEl.textContent = 'E37: No write since last change (add ! to override)';
      statusMsgEl.classList.add('ts-error');
      return true;
    }
    if (raw === ':q!' || raw === ':wq' || raw === ':x') {
      closeTelescope();
      return true;
    }
    return false;
  }

  function executeItem(item) {
    if (!item || checkSpecialQuit(input.value.trim())) return;
    if (item.isCmd === 'theme') {
      var toggle = document.getElementById('theme-toggle');
      if (toggle) toggle.click();
      closeTelescope();
      showToast('colorscheme toggled', 1600);
      return;
    }
    if (item.isCmd === 'quit') {
      closeTelescope();
      return;
    }
    if (item.isCmd === 'fastfetch' || item.isCmd === 'noop') {
      statusMsgEl.classList.remove('ts-error');
      statusMsgEl.textContent = item.isCmd === 'fastfetch' ? '-- FASTFETCH --' : '-- KEYMAPS --';
      if (window.innerWidth <= 700 && previewEl) {
        var rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        previewEl.scrollIntoView({ block: 'nearest', behavior: rm ? 'auto' : 'smooth' });
      }
      return;
    }
    closeTelescope();
    window.location.href = item.url;
  }

  function openTelescope(initialVal) {
    if (!isOpen) previousFocus = document.activeElement;
    isOpen = true;
    backdrop.hidden = false;
    backdrop.setAttribute('aria-hidden', 'false');
    setBackgroundInert(true);
    input.value = initialVal || '';
    input.setAttribute('aria-expanded', 'true');
    selectedIdx = 0;
    statusMsgEl.classList.remove('ts-error');
    statusMsgEl.textContent = '';
    renderResults();
    input.focus();
    loadIndex().then(function() {
      if (isOpen) renderResults();
    });
  }

  function closeTelescope() {
    isOpen = false;
    backdrop.hidden = true;
    backdrop.setAttribute('aria-hidden', 'true');
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
    setBackgroundInert(false);
    var target = (previousFocus && previousFocus !== document.body && typeof previousFocus.focus === 'function' && previousFocus.isConnected) ? previousFocus : triggerBtn;
    previousFocus = null;
    if (target) target.focus();
  }

  if (triggerBtn) {
    triggerBtn.addEventListener('click', function() {
      openTelescope('');
    });
  }

  if (closeBtn) {
    closeBtn.addEventListener('click', closeTelescope);
  }

  var backdropDown = false;
  backdrop.addEventListener('pointerdown', function(e) {
    backdropDown = (e.target === backdrop);
  });
  backdrop.addEventListener('pointerup', function(e) {
    if (backdropDown && e.target === backdrop) closeTelescope();
    backdropDown = false;
  });

  input.addEventListener('input', function() {
    selectedIdx = 0;
    statusMsgEl.classList.remove('ts-error');
    statusMsgEl.textContent = '';
    renderResults();
  });

  var lastMouseX = -1, lastMouseY = -1;
  resultsEl.addEventListener('mousemove', function(e) {
    if (e.clientX === lastMouseX && e.clientY === lastMouseY) return;
    lastMouseX = e.clientX;
    lastMouseY = e.clientY;
    var li = e.target.closest('.ts-item');
    if (!li) return;
    var idx = Number(li.getAttribute('data-idx'));
    if (!isNaN(idx) && idx !== selectedIdx) {
      selectedIdx = idx;
      var items = resultsEl.querySelectorAll('.ts-item');
      items.forEach(function(el, i) {
        var isSel = i === selectedIdx;
        el.classList.toggle('is-selected', isSel);
        el.setAttribute('aria-selected', String(isSel));
      });
      if (filtered.length) {
        input.setAttribute('aria-activedescendant', 'ts-opt-' + selectedIdx);
      }
      counterEl.textContent = (selectedIdx + 1) + '/' + filtered.length;
      renderPreview(filtered[selectedIdx] ? filtered[selectedIdx].item : null);
    }
  });

  resultsEl.addEventListener('click', function(e) {
    var li = e.target.closest('.ts-item');
    if (!li) return;
    var idx = Number(li.getAttribute('data-idx'));
    if (filtered[idx]) executeItem(filtered[idx].item);
  });

  // Global keyboard handler (Telescope navigation + Vim Normal Mode motions)
  var pendingG = false;
  var gTimer = null;

  document.addEventListener('keydown', function(e) {
    if (!isOpen && document.querySelector('dialog[open]')) return;

    // Ctrl+K or Cmd+K anywhere toggles Telescope
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (isOpen) closeTelescope();
      else openTelescope('');
      return;
    }

    if (isOpen) {
      if (e.key === 'Tab') {
        var focusables = Array.prototype.slice.call(
          modalEl.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')
        ).filter(function(el) {
          return el.offsetParent !== null || el === document.activeElement;
        });
        if (!focusables.length) { e.preventDefault(); return; }
        var first = focusables[0];
        var last = focusables[focusables.length - 1];
        if (e.shiftKey && (document.activeElement === first || !modalEl.contains(document.activeElement))) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && (document.activeElement === last || !modalEl.contains(document.activeElement))) {
          e.preventDefault();
          first.focus();
        }
        return;
      }
      if (e.key === 'Escape' || (e.ctrlKey && e.key === '[')) {
        e.preventDefault();
        closeTelescope();
        return;
      }
      if (e.key === 'ArrowDown' || (e.ctrlKey && (e.key === 'n' || e.key === 'j'))) {
        e.preventDefault();
        if (filtered.length) {
          selectedIdx = (selectedIdx + 1) % filtered.length;
          renderResults();
        }
        return;
      }
      if (e.key === 'ArrowUp' || (e.ctrlKey && (e.key === 'p' || e.key === 'k'))) {
        e.preventDefault();
        if (filtered.length) {
          selectedIdx = (selectedIdx - 1 + filtered.length) % filtered.length;
          renderResults();
        }
        return;
      }
      if (e.key === 'Enter') {
        e.preventDefault();
        if (checkSpecialQuit(input.value.trim())) return;
        if (filtered[selectedIdx]) {
          executeItem(filtered[selectedIdx].item);
        }
        return;
      }
      return;
    }

    // Ignore normal-mode keys when typing in inputs or when modifier keys are held
    var tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    if (e.key === 'Shift' || e.key === 'Control' || e.key === 'Alt' || e.key === 'Meta') return;

    if (e.key === '/' || e.key === ':' || e.key === '?') {
      e.preventDefault();
      pendingG = false;
      clearTimeout(gTimer);
      openTelescope(e.key === '/' ? '' : (e.key === ':' ? ':' : ':keymaps'));
      return;
    }

    // Vim g-prefix chords (gg, gh, gp, gw, gn, gc, gf)
    if (pendingG) {
      pendingG = false;
      clearTimeout(gTimer);
      var k = e.key.toLowerCase();
      if (k === 'g') {
        e.preventDefault();
        var sb = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
        window.scrollTo({ top: 0, behavior: sb });
        showToast('NORMAL · gg (top)', 900);
        return;
      }
      var routes = {
        'h': ['/', '~/home'],
        'p': ['/me/', '~/me (portfolio)'],
        'a': ['/me/', '~/me (about)'],
        'w': ['/writings/', '~/writings'],
        'n': ['/now/', '~/now'],
        'c': ['/me/contact/', '~/me/contact'],
        'f': ['/photography/', '~/photography']
      };
      if (routes[k]) {
        e.preventDefault();
        showToast('cd ' + routes[k][1], 900);
        window.location.href = routes[k][0];
        return;
      }
      chordEl.hidden = true;
      return;
    }

    if (e.key === 'g') {
      pendingG = true;
      showToast('NORMAL · g… (h:home  p:projects  w:writings  n:now  f:photos  g:top)', 2500);
      gTimer = setTimeout(function() {
        pendingG = false;
      }, 2500);
      return;
    }

    if (e.key === 'G') {
      e.preventDefault();
      var sbEnd = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
      var maxScroll = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
      window.scrollTo({ top: maxScroll, behavior: sbEnd });
      showToast('NORMAL · G (bottom)', 900);
      return;
    }

    if (e.key === 'j') {
      var sbDown = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
      window.scrollBy({ top: 140, behavior: sbDown });
      return;
    }
    if (e.key === 'k') {
      var sbUp = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth';
      window.scrollBy({ top: -140, behavior: sbUp });
      return;
    }
  });
})();
</script>
