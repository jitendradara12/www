{{- /* vid: Embedded iframe video (YouTube, Vimeo, etc.). Usage: {{< vid "https://www.youtube.com/embed/..." >}} */ -}}

        sandbox="allow-same-origin allow-scripts allow-popups"
        allowfullscreen frameborder="0"
        title="Embedded Video">
</iframe>
